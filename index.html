<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blockchain Fee Calculator - Compare Solana, Base & Tempo</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --solana-green: #14F195;
      --solana-purple: #9945FF;
      --base-blue: #0052FF;
      --tempo-orange: #FF6B35;
      --background: #0a0a0f;
      --surface: #16161f;
      --surface-hover: #1f1f2e;
      --text-primary: #ffffff;
      --text-secondary: #a0a0b8;
      --border: #2a2a3a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Mono', monospace;
      background: var(--background);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(153, 69, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(20, 241, 149, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(0, 82, 255, 0.08) 0%, transparent 50%);
      animation: bgShift 20s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes bgShift {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
      animation: fadeInDown 0.8s ease-out;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--solana-green), var(--solana-purple), var(--base-blue));
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
    }

    .calculator-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 40px;
      animation: fadeInUp 0.8s ease-out 0.2s backwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 968px) {
      .calculator-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--solana-green), var(--solana-purple));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover::before {
      opacity: 1;
    }

    .card:hover {
      border-color: var(--solana-purple);
      transform: translateY(-2px);
    }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 24px;
      height: 24px;
      display: inline-block;
    }

    .input-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      background: var(--background);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      color: var(--text-primary);
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--solana-purple);
      background: var(--surface);
    }

    input:hover, select:hover {
      border-color: var(--solana-green);
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
      animation: fadeInUp 0.8s ease-out 0.4s backwards;
    }

    .result-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .result-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      opacity: 0.05;
      transition: opacity 0.3s ease;
    }

    .result-card.solana::before {
      background: linear-gradient(135deg, var(--solana-green), var(--solana-purple));
    }

    .result-card.base::before {
      background: var(--base-blue);
    }

    .result-card.tempo::before {
      background: var(--tempo-orange);
    }

    .result-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    .result-card:hover::before {
      opacity: 0.1;
    }

    .result-card.solana {
      border-color: var(--solana-green);
    }

    .result-card.base {
      border-color: var(--base-blue);
    }

    .result-card.tempo {
      border-color: var(--tempo-orange);
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .chain-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chain-badge {
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
    }

    .chain-badge.production {
      background: rgba(20, 241, 149, 0.2);
      color: var(--solana-green);
    }

    .chain-badge.testnet {
      background: rgba(255, 107, 53, 0.2);
      color: var(--tempo-orange);
    }

    .result-metric {
      margin-bottom: 16px;
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }

    .metric-value {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .metric-value.large {
      font-size: 2.2rem;
    }

    .metric-subtext {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .savings-badge {
      display: inline-block;
      background: rgba(20, 241, 149, 0.15);
      color: var(--solana-green);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 12px;
    }

    .warning-badge {
      display: inline-block;
      background: rgba(255, 107, 53, 0.15);
      color: var(--tempo-orange);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 12px;
    }

    .chart-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 40px;
      animation: fadeInUp 0.8s ease-out 0.6s backwards;
    }

    .chart-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      text-align: center;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
      animation: fadeInUp 0.8s ease-out 0.8s backwards;
    }

    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s ease;
    }

    .info-card:hover {
      border-color: var(--solana-green);
      transform: translateY(-2px);
    }

    .info-title {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--solana-green);
    }

    .info-text {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      margin-top: 60px;
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Number input styling */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Network configuration with accurate fee data
    const NETWORKS = {
      solana: {
        name: 'Solana',
        avgFee: 0.00025,
        color: '#14F195',
        finality: 12.8, // seconds
        finalityNote: '~12.8s (150ms with Alpenglow)',
        status: 'production',
        tps: 1300,
        gradient: 'linear-gradient(135deg, #14F195, #9945FF)'
      },
      base: {
        name: 'Base',
        avgFee: 0.01,
        color: '#0052FF',
        finality: 780, // 13 minutes in seconds
        finalityNote: '~13 min (Ethereum L1)',
        status: 'production',
        tps: 98,
        gradient: '#0052FF'
      },
      tempo: {
        name: 'Tempo',
        avgFee: 0.001,
        color: '#FF6B35',
        finality: 0.6, // seconds
        finalityNote: '~0.6s (testnet, unproven)',
        status: 'testnet',
        tps: null, // Unknown
        gradient: '#FF6B35'
      }
    };

    function App() {
      const [transactions, setTransactions] = useState(1000000);
      const [txSize, setTxSize] = useState(100);
      const [timeScale, setTimeScale] = useState('month');
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      const timeScaleMultipliers = {
        week: 1,
        month: 4.33,
        year: 52
      };

      const calculateCosts = () => {
        const results = {};
        const multiplier = timeScaleMultipliers[timeScale];
        const totalTxs = transactions * multiplier;

        Object.entries(NETWORKS).forEach(([key, network]) => {
          const totalCost = totalTxs * network.avgFee;
          const avgTimePerTx = network.finality;
          const totalTime = (totalTxs * avgTimePerTx) / 3600; // hours
          const throughputTime = network.tps ? (totalTxs / network.tps) / 3600 : null; // hours

          results[key] = {
            ...network,
            totalCost,
            totalTxs,
            avgTimePerTx,
            totalTime,
            throughputTime,
            costPerDollar: (network.avgFee / txSize) * 100 // basis points
          };
        });

        return results;
      };

      const results = calculateCosts();

      // Calculate savings
      const baseCost = results.base.totalCost;
      const solanaSavings = ((baseCost - results.solana.totalCost) / baseCost * 100).toFixed(1);
      const tempoSavings = ((baseCost - results.tempo.totalCost) / baseCost * 100).toFixed(1);

      // Update chart
      useEffect(() => {
        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const ctx = chartRef.current.getContext('2d');
        
        chartInstance.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Solana', 'Base', 'Tempo'],
            datasets: [{
              label: 'Total Cost ($)',
              data: [
                results.solana.totalCost,
                results.base.totalCost,
                results.tempo.totalCost
              ],
              backgroundColor: [
                'rgba(20, 241, 149, 0.8)',
                'rgba(0, 82, 255, 0.8)',
                'rgba(255, 107, 53, 0.8)'
              ],
              borderColor: [
                '#14F195',
                '#0052FF',
                '#FF6B35'
              ],
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
              legend: {
                display: false
              },
              tooltip: {
                backgroundColor: '#16161f',
                titleColor: '#ffffff',
                bodyColor: '#a0a0b8',
                borderColor: '#2a2a3a',
                borderWidth: 1,
                padding: 12,
                displayColors: false,
                callbacks: {
                  label: function(context) {
                    return '$' + context.parsed.y.toLocaleString('en-US', {
                      minimumFractionDigits: 2,
                      maximumFractionDigits: 2
                    });
                  }
                }
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                ticks: {
                  color: '#a0a0b8',
                  callback: function(value) {
                    return '$' + value.toLocaleString();
                  }
                },
                grid: {
                  color: 'rgba(42, 42, 58, 0.5)'
                }
              },
              x: {
                ticks: {
                  color: '#ffffff',
                  font: {
                    size: 14,
                    weight: 'bold'
                  }
                },
                grid: {
                  display: false
                }
              }
            }
          }
        });

        return () => {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }
        };
      }, [transactions, timeScale, txSize]);

      const formatCurrency = (value) => {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(value);
      };

      const formatNumber = (value) => {
        return new Intl.NumberFormat('en-US').format(value);
      };

      const formatTime = (hours) => {
        if (hours < 1) {
          return `${(hours * 60).toFixed(1)} minutes`;
        } else if (hours < 24) {
          return `${hours.toFixed(1)} hours`;
        } else {
          return `${(hours / 24).toFixed(1)} days`;
        }
      };

      return (
        <div className="container">
          <header>
            <h1>Blockchain Fee Calculator</h1>
            <p className="subtitle">
              Compare transaction costs and timing across Solana, Base, and Tempo
            </p>
          </header>

          <div className="calculator-grid">
            <div className="card">
              <h2 className="card-title">
                <span className="icon">⚙️</span>
                Transaction Parameters
              </h2>
              
              <div className="input-group">
                <label htmlFor="transactions">
                  Transactions per {timeScale === 'week' ? 'Week' : timeScale === 'month' ? 'Month' : 'Year'}
                </label>
                <input
                  id="transactions"
                  type="number"
                  min="1"
                  step="1000"
                  value={transactions}
                  onChange={(e) => setTransactions(Math.max(1, parseInt(e.target.value) || 0))}
                />
              </div>

              <div className="input-group">
                <label htmlFor="txSize">
                  Average Transaction Size (USD)
                </label>
                <input
                  id="txSize"
                  type="number"
                  min="0.01"
                  step="10"
                  value={txSize}
                  onChange={(e) => setTxSize(Math.max(0.01, parseFloat(e.target.value) || 0))}
                />
              </div>

              <div className="input-group">
                <label htmlFor="timeScale">
                  Time Scale
                </label>
                <select
                  id="timeScale"
                  value={timeScale}
                  onChange={(e) => setTimeScale(e.target.value)}
                >
                  <option value="week">Weekly</option>
                  <option value="month">Monthly</option>
                  <option value="year">Yearly</option>
                </select>
              </div>
            </div>

            <div className="card">
              <h2 className="card-title">
                <span className="icon">📊</span>
                Calculation Summary
              </h2>
              
              <div className="result-metric">
                <div className="metric-label">Total Transactions</div>
                <div className="metric-value">{formatNumber(results.solana.totalTxs)}</div>
                <div className="metric-subtext">
                  Over 1 {timeScale === 'week' ? 'week' : timeScale === 'month' ? 'month' : 'year'}
                </div>
              </div>

              <div className="result-metric">
                <div className="metric-label">Total Transaction Volume</div>
                <div className="metric-value">{formatCurrency(results.solana.totalTxs * txSize)}</div>
                <div className="metric-subtext">
                  {formatNumber(transactions)} txs × ${txSize} × {timeScaleMultipliers[timeScale].toFixed(2)}
                </div>
              </div>

              <div className="result-metric">
                <div className="metric-label">Cost Per $1,000</div>
                <div className="metric-subtext" style={{ marginTop: '8px' }}>
                  Solana: {formatCurrency((results.solana.avgFee / txSize) * 1000)} • 
                  Base: {formatCurrency((results.base.avgFee / txSize) * 1000)} • 
                  Tempo: {formatCurrency((results.tempo.avgFee / txSize) * 1000)}
                </div>
              </div>
            </div>
          </div>

          <div className="results-grid">
            {/* Solana Card */}
            <div className="result-card solana">
              <div className="result-header">
                <div className="chain-name">
                  {results.solana.name}
                  <span className="chain-badge production">Live</span>
                </div>
              </div>

              <div className="result-metric">
                <div className="metric-label">Total Cost</div>
                <div className="metric-value large">{formatCurrency(results.solana.totalCost)}</div>
                <div className="savings-badge">
                  ✓ Save {solanaSavings}% vs Base
                </div>
              </div>

              <div className="result-metric">
                <div className="metric-label">Cost Per Transaction</div>
                <div className="metric-value">{formatCurrency(results.solana.avgFee)}</div>
              </div>

              <div className="result-metric">
                <div className="metric-label">Finality Time</div>
                <div className="metric-value">12.8s</div>
                <div className="metric-subtext">150ms with Alpenglow upgrade</div>
              </div>

              <div className="result-metric">
                <div className="metric-label">Network Throughput</div>
                <div className="metric-value">{formatNumber(results.solana.tps)} TPS</div>
                <div className="metric-subtext">
                  Process all txs in: {formatTime(results.solana.throughputTime)}
                </div>
              </div>
            </div>

            {/* Base Card */}
            <div className="result-card base">
              <div className="result-header">
                <div className="chain-name">
                  {results.base.name}
                  <span className="chain-badge production">Live</span>
                </div>
              </div>

              <div className="result-metric">
                <div className="metric-label">Total Cost</div>
                <div className="metric-value large">{formatCurrency(results.base.totalCost)}</div>
              </div>

              <div className="result-metric">
                <div className="metric-label">Cost Per Transaction</div>
                <div className="metric-value">{formatCurrency(results.base.avgFee)}</div>
                <div className="metric-subtext">40x higher than Solana</div>
              </div>

              <div className="result-metric">
                <div className="metric-label">Finality Time</div>
                <div className="metric-value">~13 min</div>
                <div className="metric-subtext">Ethereum L1 settlement required</div>
              </div>

              <div className="result-metric">
                <div className="metric-label">Network Throughput</div>
                <div className="metric-value">{formatNumber(results.base.tps)} TPS</div>
                <div className="metric-subtext">
                  Process all txs in: {formatTime(results.base.throughputTime)}
                </div>
              </div>
            </div>

            {/* Tempo Card */}
            <div className="result-card tempo">
              <div className="result-header">
                <div className="chain-name">
                  {results.tempo.name}
                  <span className="chain-badge testnet">Testnet</span>
                </div>
              </div>

              <div className="result-metric">
                <div className="metric-label">Total Cost (Estimated)</div>
                <div className="metric-value large">{formatCurrency(results.tempo.totalCost)}</div>
                <div className="warning-badge">
                  ⚠️ Testnet only - unproven
                </div>
              </div>

              <div className="result-metric">
                <div className="metric-label">Target Fee</div>
                <div className="metric-value">{formatCurrency(results.tempo.avgFee)}</div>
                <div className="metric-subtext">Paid in stablecoins (USDC/USDT)</div>
              </div>

              <div className="result-metric">
                <div className="metric-label">Claimed Finality</div>
                <div className="metric-value">~0.6s</div>
                <div className="metric-subtext">Not validated in production</div>
              </div>

              <div className="result-metric">
                <div className="metric-label">Network Status</div>
                <div className="metric-value" style={{ fontSize: '1.3rem' }}>4 validators</div>
                <div className="metric-subtext">
                  All Tempo-operated • Mainnet 2026
                </div>
              </div>
            </div>
          </div>

          <div className="chart-container">
            <h3 className="chart-title">Cost Comparison</h3>
            <canvas ref={chartRef} height="100"></canvas>
          </div>

          <div className="info-grid">
            <div className="info-card">
              <div className="info-title">About Solana</div>
              <div className="info-text">
                Production-proven L1 with 16+ months continuous uptime. $14.7B stablecoin supply, 
                1,300 TPS sustained throughput. Rust-based smart contracts.
              </div>
            </div>

            <div className="info-card">
              <div className="info-title">About Base</div>
              <div className="info-text">
                Optimistic rollup L2 on Ethereum. Single Coinbase sequencer with 13-minute L1 finality. 
                $4.6B stablecoin supply. EVM-compatible with Solidity.
              </div>
            </div>

            <div className="info-card">
              <div className="info-title">About Tempo</div>
              <div className="info-text">
                Payments-first L1 in testnet (Dec 2025). Backed by Stripe & Paradigm at $5B valuation.
